[project]
name = "codescout"
version = "0.1.0"
description = "Agentic codebase onboarding tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "arq>=0.26",
    "httpx>=0.28",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "cryptography>=43.0",
    "structlog>=24.4",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
]
otel = [
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped loop: the engine and schema fixtures are session-scoped, and a
# per-function loop would close connections out from under them.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "S101",     # assert: used throughout the test suite
    "B008",     # function call in default arg: how FastAPI's Depends() works
    "UP042",    # str+Enum: values are persisted as strings by SQLAlchemy
    "ASYNC109", # our own timeout params are passed straight to asyncio.wait_for
    "ASYNC240", # config/prompt files are read once at startup, not per request
    "S105",     # constants flagged as passwords (TOKEN_URL, dev-only defaults)
    "S108",     # /tmp default for the clone workspace; overridden in deployment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
